name: Install script

on:
  push:
    branches: [master]
    paths: [install.sh, test/install_test.sh, .github/workflows/install-script.yml]
  pull_request:
    paths: [install.sh, test/install_test.sh, .github/workflows/install-script.yml]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15]
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck
        if: runner.os == 'Linux'
        run: shellcheck install.sh test/install_test.sh
      - name: Unit tests
        run: sh test/install_test.sh
