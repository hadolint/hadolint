---
name: Build and deploy Hadolint Online
on:
  push:
    tags:
      - v*

  workflow_dispatch: {}

jobs:
  # The site used to build `exe:hadolint-embedded` itself, with a toolchain
  # installed by `ghcup` under `SKIP_GHC=1`. That is the path that omits
  # `--target=wasm32-wasi`, so the compiler reports a wasm target and emits
  # x86-64 assembly. It now reuses the workflow that already builds both wasm
  # modules, so there is one build and one toolchain instead of two.
  wasm:
    name: Build the wasm modules
    permissions:
      contents: read
    uses: ./.github/workflows/wasm-cli.yml

  build:
    name: Build WASM and JSFFI artifacts
    needs: wasm
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Fetch the built modules
        uses: actions/download-artifact@v8
        with:
          name: hadolint-wasm32-wasi

      - name: Place them where the site loads them
        run: |
          mv hadolint-embedded.wasm website/hadolint.wasm
          mv ghc_wasm_jsffi.js website/js/ghc_wasm_jsffi.js
          ls -l website/hadolint.wasm website/js/ghc_wasm_jsffi.js

      - name: Upload WASM Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: website

  deploy:
    needs:
      - build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
