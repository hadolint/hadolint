---
name: Build and deploy Hadolint Online
on:
  push:
    tags:
      - v*

  workflow_dispatch: {}

jobs:
  # The site used to build `exe:hadolint-embedded` in a second job, with its
  # own toolchain installed by `ghcup` under `SKIP_GHC=1`. That works — it has
  # since 962e8cf, which passes `-- $CONFIGURE_ARGS` — but it is a second build
  # and a second toolchain for the same module. This reuses the workflow that
  # already builds both wasm modules.
  wasm:
    name: Build the wasm modules
    permissions:
      contents: read
    uses: ./.github/workflows/wasm-cli.yml

  build:
    name: Build WASM and JSFFI artifacts
    needs: wasm
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Fetch the built modules
        uses: actions/download-artifact@v8
        with:
          name: hadolint-wasm32-wasi

      - name: Place them where the site loads them
        run: |
          mv hadolint-embedded.wasm website/hadolint.wasm
          mv ghc_wasm_jsffi.js website/js/ghc_wasm_jsffi.js
          ls -l website/hadolint.wasm website/js/ghc_wasm_jsffi.js

      - name: Upload WASM Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: website

  deploy:
    needs:
      - build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
