# This pyproject.toml is a wrapper so that Python installers, like pre-commmit, can install the hadolint binary automatically from Github.
[build-system]
requires = ["release-gitter[builder]==3.2.0"]
build-backend = "pseudo_builder"

[tool.release-gitter]
git-url = "https://github.com/hadolint/hadolint"
format = "hadolint-{system}-{arch}"
exec = "mv {} hadolint && chmod +x hadolint"
